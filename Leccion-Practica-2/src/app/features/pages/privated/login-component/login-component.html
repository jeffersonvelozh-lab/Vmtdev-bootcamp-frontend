<div class="login-container">
  <mat-card class="login-card">
    <div class="login-header">
      <h1>Iniciar Sesión</h1>

      <p>Bienvenido de nuevo</p>
    </div>

    <mat-card-content>
      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico</mat-label>

          <input matInput type="email" placeholder="correo@example.com" />

          <mat-icon matSuffix> email </mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>

          <input matInput type="password" placeholder="********" />

          <mat-icon matSuffix> lock </mat-icon>
        </mat-form-field>

        <button mat-flat-button color="primary" class="login-button" type="submit">
          <span class="btn-content"> <mat-icon>login</mat-icon> Ingresar </span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
