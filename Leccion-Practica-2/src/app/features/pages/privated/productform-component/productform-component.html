<mat-card appearance="outlined" class="dialog-padding">
  <mat-card-header class="form-header">
    <div class="header-container">
      <div>
        <mat-card-title class="title"> formulario </mat-card-title>
      </div>
    </div>
  </mat-card-header>

  <mat-card-content>
    <form class="form">
      <mat-form-field appearance="outline">
        <mat-label>Nombre del producto</mat-label>
        <input matInput placeholder="Nombre del producto" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Precio</mat-label>
        <input matInput placeholder="Precio" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Stock</mat-label>
        <input matInput placeholder="Stock" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descripción</mat-label>
        <input matInput placeholder="Descripción" />
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button type="button">Cancelar</button>

        <button mat-flat-button color="primary" type="submit" class="submit-btn">Guardar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
