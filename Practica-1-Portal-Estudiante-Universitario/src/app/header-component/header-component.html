<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header Component</title>
    <link rel="stylesheet" href="header-component.scss">
  </head>
<body>
    <!--Inicio de página-->
    <header class="header">
        <nav>
            <div class="nav-links">
                <h1>{{appName}}</h1>
                <p>
                  Estudiante:
                  <span [style.color] = "Connected ? 'green': 'grey'">
                    {{studentName}}
                  </span>
                </p>
                <button (click)="Connected = !Connected">
                  {{Connected ? 'Conectar':'Desconectar'}}
                </button>
            </div>
        </nav>
    </header>
</body>
</html>
