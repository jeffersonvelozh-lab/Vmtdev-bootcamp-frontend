<section>

  <!-- Input con ngModel -->
  <input [(ngModel)]="busqueda" placeholder="Buscar materia..." />
  <p>Buscando: {{ busqueda }}</p>

  <!-- Lista de materias -->
  <ul>
    @for (materia of materias; track materia.nombre) {
      <li [ngClass]="materia.aprobada ? 'aprobada' : 'reprobada'">
        {{ materia.nombre }} — {{ materia.creditos }} créditos
      </li>
    } @empty {
      <li>No tienes materias registradas</li>
    }
  </ul>

  <!-- Barra de progreso -->
  <p>Créditos: {{ creditos }} / 120</p>
  <div class="barra-fondo">
    <div
      class="barra-progreso"
      [style.width.%]="porcentaje"
      [style.background-color]="colorBarra">
    </div>
  </div>
  <p>{{ porcentaje }}%</p>

  <!-- Botones -->
  <button (click)="restar()">- 10</button>
  <button (click)="sumar()">+ 10</button>

</section>
