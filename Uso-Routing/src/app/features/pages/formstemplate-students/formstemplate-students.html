<mat-dialog-content>
  <h2 mat-dialog-title>Crear Estudiante</h2>
  <mat-dialog-content>
    <form class="crearstudent-form">
      <mat-form-field appearance="outline" style="width: 100%">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" placeholder="nombre" />
      </mat-form-field>

      <mat-form-field class="example-full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="example@email.com" />
      </mat-form-field>

      <mat-form-field class="example-full-width">
        <mat-label> Id del curso </mat-label>
        <input matInput formControlName="cursoId" />
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-button color="primary" mat-dialog-close>Guardar</button>
  </mat-dialog-actions>
</mat-dialog-content>
