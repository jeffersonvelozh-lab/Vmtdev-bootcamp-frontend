@if (loading) {
  <mat-spinner></mat-spinner>
}

<div class="container">
  @for (estudiante of Student; track estudiante.id) {
    <mat-card class="student-card" appearance="outlined">
      <mat-card-header class="header-card">
        <mat-card-title class="nombre">{{ estudiante.name }}</mat-card-title>
        <mat-card-subtitle class="email"> {{ estudiante.email }} </mat-card-subtitle>
      </mat-card-header>
      <img mat-card-image [src]="estudiante.avatar" alt="Avatar" />
      <mat-card-content> </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" [routerLink]="['/students/id', estudiante.id]">ver detalle</button>
      </mat-card-actions>
    </mat-card>
  }
</div>
