@if (loading) {
  <mat-spinner></mat-spinner>
}

@if (errorMessage) {
  <div>
    {{ errorMessage }}
  </div>
}

@if (student) {
  <mat-card>
    <img [src]="student.avatar" />

    <h2>{{ student.name }}</h2>

    <p>{{ student.email }}</p>

    <p>{{ student.courseId }}</p>

    <p>{{ student.createAt }}</p>

    <button mat-raised-button routerLink="/students">Volver</button>
  </mat-card>
}
