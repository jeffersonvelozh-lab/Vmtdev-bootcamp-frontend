<h2>Lista de Departamentos</h2>

@if (loading) {
  <div>Cargando...</div>
}

@if( errorMessage){
<div>
  {{ errorMessage }}
</div>
}

<div>
  <button class="btn-add" (click)="agregarDepartments()" >Agregar</button>
  <button class="btn-edit" (click)="editarDepartment()" >Editar</button>
</div>
<div class="card">
  @for(department of departments; track department.id ){
    <div class="grid">
      <h3>{{ department.id }}</h3>
      <p>Name: {{ department.name }}</p>
      <p>Manager Name: {{ department.managerName }}</p>
      <p>Description: {{ department.description }}</p>
      <button class="btn_delete" (click)="eliminarDepartment(department.id)">Eliminar</button>
    </div>
  }

</div>
